version: '3.8'

services:
  db:
    image: postgres:15
    container_name: marigest_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marigest
    ports:
      - "5432:5432"
    volumes:
      - marigest_data:/var/lib/postgresql/data

volumes:
  marigest_data:
